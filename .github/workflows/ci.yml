name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest fastapi uvicorn httpx

      - name: Run tests
        run: |
          python -m pytest tests/ -q

      - name: Skill self-check
        run: |
          python cli.py selftest

      - name: Agent toolchain e2e
        run: |
          python tools/agent_e2e_check.py

      - name: HTTP server smoke
        run: |
          python tools/server_smoke.py

  # Commit gate: the repo's own code must pass its own lint before merge.
  # semgrep runs here (CI installs it); locally it degrades gracefully.
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml semgrep
      - name: Self-lint (builtin rules + semgrep, fail on high)
        run: |
          python cli.py sast core --fail-on high
          python cli.py sast tools --fail-on high

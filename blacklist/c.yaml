# blacklist/c.yaml — C/C++ hard-banned patterns (cpp inherits c)

- id: BLC-001
  name: c_banned_gets
  severity: high
  cwe: CWE-242
  message: "gets() used (removed in C11 - buffer overflow is inevitable) | 使用 gets()（已从 C11 移除，缓冲区溢出必然发生）"
  fix_hint: "Use fgets(buf, sizeof(buf), stdin); gets cannot limit input length, so any use is unacceptable. | 使用 fgets(buf, sizeof(buf), stdin) 替代 gets；gets 无法限制读入长度，任何使用都不可接受。"
  match:
    regex:
      - >-
        (?<![\w.])gets\s*\(
      - >-
        std::\s*gets\s*\(
    exclude_regex: []


- id: BLC-002
  name: c_system_variable_command
  severity: high
  cwe: CWE-78
  message: "system/popen called with a variable command argument (command injection - high risk) | system/popen 以变量为命令参数（命令注入高风险）"
  fix_hint: "The command argument to system must be a compile-time constant; for dynamic parameters use fork+execve (argv array) and whitelist user input. | system 的命令参数必须是编译期常量字符串；需要动态参数时用 execve/fork+exec（argv 数组），并对用户输入做白名单校验。"
  match:
    regex:
      - >-
        (?i)\b(system|popen)\s*\(\s*[A-Za-z_][A-Za-z0-9_\[\]>.]*
    exclude_regex:
      - >-
        \b(system|popen)\s*\(\s*"


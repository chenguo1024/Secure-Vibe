# blacklist/python.yaml — Python 危险模式黑名单（与 rules 格式一致，合并加载）
# 本文件存放"硬禁用"模式：出现即判不通过，通常无商量余地。
# 注意：regex 正则一律用 YAML 块标量（>-）书写，避免引号转义问题。

- id: BL-001
  name: banned_import
  severity: high
  message: 导入了被禁用的危险模块
  fix_hint: 以下模式在安全生成场景中默认禁用：ctypes 任意内存操作、os.exec* 系列。确有需要请在 config.yaml 的 ignore_rules 中显式放行并说明理由。
  match:
    regex:
      - >-
        (?i)\bimport\s+ctypes\b|\bfrom\s+ctypes\b
      - >-
        (?<![\w.])os\.execv\w*\s*\(
    exclude_regex: []

- id: BL-002
  name: banned_dynamic_import
  severity: medium
  cwe: CWE-96
  message: 使用 __import__ 动态导入（可能加载恶意模块）
  fix_hint: 使用 importlib.import_module 并对模块名做白名单校验；禁止 __import__(用户输入)。
  match:
    regex:
      - >-
        (?<![\w.])__import__\s*\(
    exclude_regex:
      - >-
        __import__\s*\(\s*["'][a-zA-Z_][\w.]*["']\s*\)

- id: BL-003
  name: xss_unescaped_output
  severity: high
  cwe: CWE-80
  message: 检测到向 HTML 输出未转义的用户输入（XSS 风险）
  fix_hint: 使用模板引擎的自动转义（Jinja2 默认）；不要对含用户输入的内容调用 markupsafe.Markup/|safe。
  match:
    regex:
      - >-
        (?i)Markup\s*\([^)]*(request|input|form|args|data)
      - >-
        \|\s*safe\b
    exclude_regex: []

- id: BL-004
  name: banned_pickle_untrusted
  severity: high
  cwe: CWE-502
  message: 全局禁用 pickle.load(s) 处理网络/用户数据
  fix_hint: 网络数据一律用 JSON；如确需 pickle，仅限可信内部数据且通过 ignore_rules 显式放行。
  match:
    regex:
      - >-
        (?i)pickle\.loads?\s*\([^)]*(request|socket|recv|input|urlopen|response)
    exclude_regex: []

- id: BL-005
  name: dynamic_builtin_access
  severity: high
  cwe: CWE-95
  message: 通过 getattr/builtins 动态访问 eval/exec/open/compile 等危险内建（绕过静态检测）
  fix_hint: 禁止动态取用危险内建函数；这是常见的静态检测绕过手段，改用安全 API（json.loads/ast.literal_eval）并移除该调用。
  match:
    regex:
      - >-
        (?i)getattr\s*\(\s*_*builtins?_*\s*,\s*["'](eval|exec|open|compile|input|globals|locals)["']\s*\)
      - >-
        (?i)_*builtins?_*\s*\[["'](eval|exec|open|compile)["']\]
    exclude_regex: []

# Secure-Vibe global configuration
# Every field can be overridden via the environment variable SECURE_VIBE_<UPPERCASED_FIELD>

# LLM backend settings
llm:
  # available backend values:
  #   session  - follows the agent's own LLM (default when the skill is installed inside an agent;
  #              generation is done by the model the agent uses; this skill calls no external API)
  #   openai   - direct OpenAI in standalone runs (needs OPENAI_API_KEY)
  #   claude   - direct Anthropic in standalone runs (needs ANTHROPIC_API_KEY)
  #   ollama   - local model (needs a local Ollama)
  #   mock     - for testing: offline, returns preset code
  backend: session
  model: ""              # leave empty to use each backend's default model
  temperature: 0.2
  max_tokens: 2048
  timeout: 60            # per-call LLM timeout (seconds)
  base_url: ""           # custom API base (Ollama / proxy)

# Validator settings
validator:
  max_time_ms: 50        # max time allowed for one validation (ms; logs a warning when exceeded)
  taint_analysis: true   # lightweight taint analysis (Python only): confirms user input reaching dangerous sinks
  enabled_checkers:      # empty means all enabled
    - ast                # AST dangerous-call analysis
    - regex              # regex blacklist matching
    - taint              # taint data-flow analysis
  ignore_rules: []       # globally ignored rule IDs, e.g. ["GEN-004"]

# Repair-loop settings
repair:
  max_retries: 3         # maximum repair rounds
  strategy: hybrid       # hybrid = deterministic template replacement first + LLM local rewrite; llm_only = all via LLM
  local_rewrite: true    # rewrite only the violating fragment instead of regenerating everything

# Logging settings
logging:
  dir: logs              # JSONL output directory
  filename_pattern: "%Y-%m-%d.jsonl"   # one file per date
  log_inputs: true       # whether to record full inputs (task description/context)
  log_code: true         # whether to record each round's full code
  mask_secrets: true     # whether to mask suspected secrets in logs

# Rule directories
rules_dir: rules
blacklist_dir: blacklist
templates_dir: templates

# Versioning and updates
version: "1.0.0"          # keep in sync with the VERSION file
# Install source repo (written by the install script on git-managed installs):
# once set, cli.py version --check can query the remote latest version and cli.py update can pull updates
source_repo: ""           # e.g. https://github.com/yourname/secure-vibe.git

# Pro-level evaluation (optional paper-grade benchmark, disabled by default)
# Download the SecurityEval dataset and configure its path first; see docs/evaluation.md
evaluation:
  enabled: false
  # SecurityEval dataset path (s2labres/security-eval, must be downloaded)
  securityeval_path: ""     # e.g. D:\datasets\SecurityEval
  # Evaluation metrics
  metrics:
    - detection_rate        # malicious-sample detection rate (higher is better)
    - false_positive_rate   # safe-sample false-positive rate (lower is better)
    - repair_success_rate   # repair-loop convergence rate
    - avg_repair_rounds     # average repair rounds
    - avg_latency_ms        # average validation latency

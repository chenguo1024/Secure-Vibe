# rules/general.yaml — Cross-language general security rules (regex engine)

- id: GEN-001
  name: hardcoded_secret
  severity: high
  cwe: CWE-798
  # literal_sensitive: patterns 2-6 match string CONTENTS (secret charsets) —
  # this rule is matched against the raw line, not the lexically stripped shape
  literal_sensitive: true
  message: "Hardcoded secret/password/API key detected | 检测到硬编码密钥/密码/API Key"
  fix_hint: "Never hardcode secrets in code; read from environment variables (os.environ) or inject at deploy time; rotate any exposed secrets. | 不要在代码中硬编码密钥。改从环境变量读取（os.environ），或在部署时注入配置；同时轮换已泄露的密钥。"
  template: secure_config
  match:
    regex:
      - >-
        (?i)(api[_-]?key|apikey|secret|secret[_-]?key|password|passwd|pwd|access[_-]?token|auth[_-]?token|private[_-]?key)\s*[=:]\s*["'][^"']{6,}["']
      - >-
        (?i)(AKIA[0-9A-Z]{16})
      - >-
        (?i)(sk-[A-Za-z0-9_-]{20,})
      - >-
        -----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----
      - >-
        (?i)(ghp_[A-Za-z0-9]{36,}|gho_[A-Za-z0-9]{36,})
      - >-
        (?i)\b(?:mysql|postgres(?:ql)?|mongodb(?:\+srv)?)://[^/\s:]+:[^@\s/]+@
    exclude_regex:
      - >-
        (?i)\{\{|\$\{|<[^>]+>|your[_-]?key|your[_-]?api|xxx+|placeholder|changeme|dummy|test[_-]?key|os\.environ|getenv


- id: GEN-002
  name: plaintext_http
  severity: low
  cwe: CWE-319
  # literal_sensitive: http:// appears inside string values, not in code shape
  literal_sensitive: true
  message: "Plaintext HTTP URL used - traffic is unencrypted | 使用明文 HTTP 链接，传输未加密"
  fix_hint: "Use https://; if plain http is truly necessary (e.g. local debugging) add an explicit comment explaining why. | 改用 https://；确需 http（如本地调试）时请显式注释说明原因。"
  match:
    regex:
      - >-
        ["'`]http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])
    exclude_regex:
      - >-
        \b//\s.*http://


- id: GEN-003
  name: insecure_random
  severity: medium
  cwe: CWE-338
  message: "Insecure randomness (random module) used for security-sensitive values | 使用不安全的随机数（random 模块）生成安全相关值"
  fix_hint: "Security uses (tokens, password reset codes, session IDs, keys) must use the secrets module: secrets.token_hex / secrets.token_urlsafe / secrets.choice. | 安全用途（token、密码重置码、会话 ID、密钥）必须使用 secrets 模块：secrets.token_hex / secrets.token_urlsafe / secrets.choice。"
  template: secure_token
  match:
    ast_calls:
      - random.random
      - random.randint
      - random.choice
      - random.randrange
      - random.uniform
      - random.sample
      - random.getrandbits
    exclude_regex: []


- id: GEN-004
  name: weak_hash
  severity: medium
  cwe: CWE-327
  message: "Weak hash algorithm (md5/sha1) | 使用弱哈希算法（md5/sha1）"
  fix_hint: "Store passwords with bcrypt/argon2/scrypt; use hashlib.sha256 or stronger for integrity. md5/sha1 only for non-security uses like cache keys. | 密码存储用 bcrypt/argon2/scrypt；完整性校验用 hashlib.sha256 及以上。md5/sha1 仅可用于缓存键等非安全场景。"
  template: password_hash
  match:
    ast_calls:
      - hashlib.md5
      - hashlib.sha1
    regex:
      - >-
        (?i)\b(MD5|SHA1)\s*\(
    exclude_regex: []


- id: GEN-005
  name: sql_string_concat
  severity: high
  cwe: CWE-89
  # literal_sensitive: SELECT/INSERT keywords live inside the string content
  literal_sensitive: true
  message: "SQL statement string concatenation/formatting detected (SQL injection risk) | 检测到 SQL 语句字符串拼接/格式化（SQL 注入风险）"
  fix_hint: "Use parameterized queries: cursor.execute(sql, params) or ORM bound parameters; never build SQL via f-string/%/.format/+ concatenation. | 使用参数化查询：cursor.execute(sql, params)，或 ORM 的绑定参数；禁止 f-string/%/.format/+ 拼接 SQL。"
  template: db_query
  match:
    regex:
      - >-
        (?i)execute\s*\(\s*f["']
      - >-
        (?i)f["'`](\s*)(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER)\b
      - >-
        (?i)["'`](SELECT|INSERT|UPDATE|DELETE)\b[^"'`]*\+\s*\w+
      - >-
        (?i)execute\s*\([^)]*%\s*\w+
      - >-
        (?i)execute\s*\([^)]*\.format\s*\(
      - >-
        (?i)execute\s*\(\s*\w+\s*\+\s*\w+
      - >-
        (?i)(SELECT|INSERT|UPDATE|DELETE)\b[^"'`]*\{[^}]*\}
      - >-
        (?i)["'`](SELECT|INSERT|UPDATE|DELETE)\s.*["'`]\s*%
    exclude_regex:
      - >-
        execute\s*\([^,)]*,\s*[\[\(]?\s*\w+\s*[\]\)]?\s*\)


- id: GEN-006
  name: sensitive_print
  severity: low
  cwe: CWE-532
  message: "Password/key/token may be printed or written to logs | 可能把密码/密钥/token 打印或写入日志"
  fix_hint: "Do not write sensitive credentials to logs/stdout; when debugging, print a masked value (e.g. sk-****). | 不要将敏感凭据输出到日志/stdout；如需调试请输出掩码（如 sk-****）。"
  match:
    regex:
      - >-
        (?i)print\s*\([^)]*(password|passwd|secret|api[_-]?key|token|credential)
      - >-
        (?i)logger?\.\w+\s*\([^)]*(password|passwd|secret|api[_-]?key|credential)
    exclude_regex:
      - >-
        mask|\*{3,}|redact|len\(


- id: GEN-007
  name: jwt_no_verify
  severity: high
  cwe: CWE-347
  # literal_sensitive: verify_signature appears as a string dict key
  literal_sensitive: true
  message: "JWT decoded without signature verification | JWT 解码未校验签名"
  fix_hint: "Must use jwt.decode(token, key, algorithms=[...]); never disable signature verification via options. | 必须使用带密钥和算法校验的 jwt.decode(token, key, algorithms=[...])；禁止关闭签名校验的 options 配置。"
  match:
    regex:
      - >-
        (?i)verify_signature["']?\s*:\s*False
      - >-
        (?i)jwt\.decode\s*\([^)]*verify\s*=\s*False
    exclude_regex: []


- id: GEN-008
  name: tls_verification_disabled
  severity: medium
  cwe: CWE-295
  message: "TLS certificate verification disabled | 禁用了 TLS 证书校验"
  fix_hint: "Keep verify=True (default); add self-signed certs to the trust store instead of disabling verification. | 保持 verify=True（默认）；自签名证书应加入信任库，而不是关闭校验。"
  match:
    regex:
      - >-
        (?i)verify\s*=\s*False
      - >-
        (?i)ssl\._create_unverified_context\s*\(
      - >-
        (?i)check_hostname\s*=\s*False
    exclude_regex: []


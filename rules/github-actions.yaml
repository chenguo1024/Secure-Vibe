# rules/github-actions.yaml — GitHub Actions workflow security rules

- id: GHA-001
  name: gha_expression_injection
  severity: high
  cwe: CWE-74
  message: "Untrusted expression expanded inside run (${{ github.event.issue.body }}) - script injection | run 脚本中直接展开不可信表达式（${{ github.event.issue.body }} 等，脚本注入风险）"
  fix_hint: "Move issue/PR content into an environment variable and reference that; never expand ${{ github.event.* }} text directly inside run scripts. | 把 issue/PR 内容写入环境变量（env）再引用，绝不在 run 里直接展开 ${{ github.event.* }} 文本；引号包裹在脚本上下文内也挡不住注入。"
  match:
    regex:
      - >-
        run\s*:\s*[^\n]*\$\{\{\s*github\.event\.(issue|pull_request|comment|review|discussion)\.(body|title|title|.*)
    exclude_regex: []


- id: GHA-002
  name: gha_secret_to_log
  severity: medium
  cwe: CWE-532
  message: "Secret written to logs (echo/printf of secrets) | 把 secret 写入日志（echo/printf 输出 secrets）"
  fix_hint: "Never echo ${{ secrets.X }}; for diagnostics only test existence ([ -n \"$TOKEN\" ]); GitHub auto-masks registered secrets, but explicit echo is still unnecessary and risky. | 禁止 echo ${{ secrets.X }}；需要诊断用掩码或环境变量测是否存在（如 [ -n \"$TOKEN\" ]）。Actions 自动对注册 secret 打码，但直接 echo 仍不必要且易泄露。"
  match:
    regex:
      - >-
        (?i)\b(echo|printf|cat|print)\b[^\n]*\$\{\{\s*secrets\.[A-Za-z_]+\s*\}\}
    exclude_regex: []


- id: GHA-003
  name: gha_unpinned_action
  severity: medium
  cwe: CWE-1104
  message: "Third-party action used with an unpinned reference (supply-chain risk) | 使用未锁定版本/引用的第三方 action（供应链风险）"
  fix_hint: "Pin actions to a full commit SHA (actions/checkout@<40-hex-sha>) or at least a specific tag; never @main/@master/@latest. | 锁定 action 到完整提交 SHA（uses: actions/checkout@<40位sha>）或至少具体 tag；禁止 @main/@master 浮动引用。"
  match:
    regex:
      - >-
        (?i)\buses\s*:\s*[^\s@]+\/\S+@(main|master|head|latest)\b
    exclude_regex: []


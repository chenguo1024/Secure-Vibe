# rules/js.yaml — JavaScript 特有安全规则（正则引擎；浏览器 + Node 通用）
# html 继承 js 规则（内联 <script> 片段同样被覆盖）。
# 注意：含冒号的字符串一律加引号，避免 YAML 解析错误。

- id: JS-001
  name: js_eval_new_function
  severity: high
  cwe: CWE-95
  message: 使用 eval / new Function 动态执行代码（代码注入风险）
  fix_hint: 禁止 eval/new Function 处理不可信输入；解析数据用 JSON.parse，动态逻辑用对象字面量分发或 Map。
  match:
    regex:
      - >-
        (?<![\w.$])eval\s*\(
      - >-
        new\s+Function\s*\(
    exclude_regex: []

- id: JS-002
  name: js_innerhtml_assignment
  severity: high
  cwe: CWE-79
  message: 向 innerHTML 赋值非字面量（DOM XSS 风险）
  fix_hint: 用 textContent 赋值纯文本；必须插入 HTML 时先经 DOMPurify 等库净化，或只拼接受控白名单片段。
  match:
    regex:
      - >-
        \.\s*innerHTML\s*=\s*(?!=)(?!\s*["'`])(?!\s*`?\s*$)
    exclude_regex:
      - >-
        DOMPurify|sanitize|purify

- id: JS-003
  name: js_document_write
  severity: medium
  cwe: CWE-79
  message: 使用 document.write 输出（XSS 风险，且阻塞解析）
  fix_hint: 用 DOM API（createElement/textContent/appendChild）或 textContent 更新内容，避免 document.write。
  match:
    regex:
      - >-
        document\.write(ln)?\s*\(
    exclude_regex: []

- id: JS-004
  name: js_string_timer
  severity: high
  cwe: CWE-95
  message: setTimeout/setInterval 的参数为字符串（等价 eval，代码注入风险）
  fix_hint: 传函数引用而非字符串：setTimeout(fn, delay)；禁止 setTimeout("code", ...)。
  match:
    regex:
      - >-
        set(Timeout|Interval)\s*\(\s*["'`]
    exclude_regex: []

- id: JS-005
  name: js_postmessage_wildcard
  severity: medium
  cwe: CWE-346
  message: postMessage 使用通配符目标源（跨源消息可发给任意域）
  fix_hint: targetOrigin 指定明确的源（如 "https://app.example.com"），禁止 "*"；接收端必须校验 event.origin。
  match:
    regex:
      - >-
        postMessage\s*\([^)]*,\s*["']\*["']
    exclude_regex: []

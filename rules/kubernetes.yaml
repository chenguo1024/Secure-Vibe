# rules/kubernetes.yaml — Kubernetes manifest security rules

- id: K8S-001
  name: k8s_privileged_container
  severity: high
  cwe: CWE-269
  message: "Container runs in privileged mode (host device access) | 容器以 privileged 特权模式运行（可访问宿主机设备）"
  fix_hint: "Remove privileged: true; grant only the specific capabilities needed (add: [...]) instead of privileged mode. | 移除 privileged: true；按需只放行具体 capabilities（add: [...]），禁止特权模式。"
  match:
    regex:
      - >-
        (?i)privileged\s*:\s*true
    exclude_regex: []


- id: K8S-002
  name: k8s_hostpath_volume
  severity: high
  cwe: CWE-269
  message: "hostPath volume mounted (container escape / host file access) | 挂载 hostPath 宿主目录（容器逃逸/宿主文件读写）"
  fix_hint: "Use emptyDir/PVC instead; if hostPath is truly required, restrict it to a read-only subdirectory and audit the usage. | 改用 emptyDir/PVC；确需 hostPath 时限定只读子目录并审计。"
  match:
    regex:
      - >-
        (?i)hostPath\s*:
    exclude_regex: []


- id: K8S-003
  name: k8s_host_network
  severity: high
  cwe: CWE-269
  message: "hostNetwork/hostPID/hostIPC used (shared host namespaces) | 使用 hostNetwork/hostPID/hostIPC（共享宿主机命名空间）"
  fix_hint: "Keep the default isolation; remove hostNetwork/hostPID/hostIPC: true. | 保持默认隔离；移除 hostNetwork/hostPID/hostIPC: true。"
  match:
    regex:
      - >-
        (?i)(hostNetwork|hostPID|hostIPC)\s*:\s*true
    exclude_regex: []


- id: K8S-004
  name: k8s_run_as_root
  severity: medium
  cwe: CWE-269
  message: "Container runs as root and privilege escalation is not disabled | 容器以 root 运行且未禁用特权提升"
  fix_hint: "Set runAsNonRoot: true, ensure runAsUser is non-0, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true. | securityContext 设 runAsNonRoot: true、runAsUser 非 0、allowPrivilegeEscalation: false、readOnlyRootFilesystem: true。"
  match:
    regex:
      - >-
        (?i)runAsUser\s*:\s*0
      - >-
        (?i)allowPrivilegeEscalation\s*:\s*true
      - >-
        (?i)runAsNonRoot\s*:\s*false
    exclude_regex: []


- id: K8S-005
  name: k8s_secret_env_plaintext
  severity: medium
  cwe: CWE-522
  message: "Secrets exposed wholesale via env (easier to leak through logs/debugging) | Secret 整体以 env 方式暴露（更易被日志/调试泄露）"
  fix_hint: "Reference individual keys via secretKeyRef; prefer volume mounts or a runtime secret provider for sensitive data. | 用 secretKeyRef/envFrom 按需引用单个键；敏感数据避免放进 env（用 volume mount 或运行时 secret provider）。"
  match:
    regex:
      - >-
        (?i)secretKeyRef\s*:\s*\{\s*name\s*:\s*\S+[\s\S]{0,80}?key\s*:\s*\S+
    exclude_regex:
      - >-
        optional

